[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clepsy"
version = "0.1.0"
description = "Thin client SDK for the Dynamic Auth Framework (DAF) -- time-based dynamic password authentication."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "H. Channabasava" }]
keywords = ["authentication", "dynamic-password", "dpp", "auth", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/channachannu/dynamic-auth-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/clepsy"]
